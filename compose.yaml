name: spechelper
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    POSTGRES_HOST: database
    POSTGRES_DB: spechelper
    POSTGRES_USER: spechelper
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spechelper-local}
    SPECHELPER_DATA_DIR: /data
    RUNTIME_URL: http://worker:8091
    RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
    CLI_MAINTENANCE_URL: http://cli-maintenance:8092
    CLI_MAINTENANCE_TOKEN_FILE: /cli-control/token
    SPECHELPER_ANALYSIS_POLICY_FILE: ${SPECHELPER_ANALYSIS_POLICY_FILE:-}
    SPECHELPER_AI_ACCOUNT_CONCURRENCY: ${SPECHELPER_AI_ACCOUNT_CONCURRENCY:-4}
    SPECHELPER_AI_CONCURRENCY: ${SPECHELPER_AI_CONCURRENCY:-8}
    CONTROL_TOKEN_FILE: /control/runtime.token
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
    SPECHELPER_ACCESS_PASSWORD_HASH: ${SPECHELPER_ACCESS_PASSWORD_HASH:-}
    SPECHELPER_ACCESS_PASSWORD_FILE: ${SPECHELPER_ACCESS_PASSWORD_FILE:-}
    SPECHELPER_LOCAL_ONLY: ${SPECHELPER_LOCAL_ONLY:-1}
    SPECHELPER_REQUIRE_HTTPS: ${SPECHELPER_REQUIRE_HTTPS:-0}
    SPECHELPER_TRUST_PROXY: ${SPECHELPER_TRUST_PROXY:-0}
    SPECHELPER_AUDIT_RETENTION_DAYS: ${SPECHELPER_AUDIT_RETENTION_DAYS:-30}
    ENCRYPTION_KEY_FILE: ${ENCRYPTION_KEY_FILE:-/data/encryption.key}
  volumes:
    - runtime-control-secrets:/control
    - app-data:/data
    - git-cache:/data/git-cache
    - environment-workspaces:/data/environments
    - analysis-workspaces:/data/analysis-workspaces
    - analysis-context:/data/analysis-context
    - uploads:/data/requests
    - cli-maintenance-control:/cli-control:ro
  networks: [app, backend-egress, runtime-control, cli-control]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
  restart: unless-stopped
services:
  prepare-storage:
    <<: *backend
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    network_mode: none
    networks: !reset []
    restart: "no"
    entrypoint: [python, -c]
    command:
      - |
        import os
        from pathlib import Path
        for root in (Path("/data"), Path("/control")):
            for directory, dirs, files in os.walk(root, followlinks=False):
                os.chown(directory, 10000, 10000)
                for name in dirs + files:
                    path = Path(directory) / name
                    if not path.is_symlink():
                        os.chown(path, 10000, 10000)
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: spechelper
      POSTGRES_USER: spechelper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spechelper-local}
    volumes: [database-data:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U spechelper -d spechelper]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    <<: *backend
    networks: [app, backend-egress, cli-control]
    command: [sh, -c, 'python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60']
    depends_on:
      prepare-storage: {condition: service_completed_successfully}
      database: {condition: service_healthy}
      cli-maintenance: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")']
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    environment:
      <<: *backend-env
      RUNTIME_URL: http://agent-runtime:8090
      WORKER_GATEWAY: "1"
    command: [python, manage.py, worker]
    depends_on:
      backend: {condition: service_healthy}
  agent-runtime:
    # Bubblewrap creates namespace children; reap orphaned children between calls.
    init: true
    mem_limit: 2g
    pids_limit: 256
    build:
      context: .
      dockerfile: runtime/Dockerfile
    environment:
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      CONTROL_TOKEN_FILE: /control/runtime.token
      SPECHELPER_DATA_DIR: /data
      SESSION_DIR: /sessions
    # Bubblewrap creates a mount/PID namespace and drops all caps for the agent.
    # The runtime has no Docker socket, application DB or GitHub credentials.
    cap_add: [SYS_ADMIN, NET_ADMIN]
    read_only: true
    cpus: 2
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    ulimits:
      nofile: 1024
      core: 0
    security_opt: [seccomp:unconfined, apparmor:unconfined]
    volumes:
      - runtime-control-secrets:/control:ro
      - git-cache:/data/git-cache:ro
      - analysis-workspaces:/data/analysis-workspaces:ro
      - analysis-context:/data/analysis-context:ro
      - uploads:/data/requests:ro
      - ai-credentials:/credentials
      - ai-sessions:/sessions
      - cli-tools:/cli-tools:ro
    networks: [runtime-control, agent-egress]
    restart: unless-stopped
  prepare-cli-storage:
    build:
      context: .
      dockerfile: runtime/Dockerfile
      target: cli-maintenance
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    volumes: [cli-tools:/cli-tools, cli-maintenance-control:/cli-control]
    entrypoint: [python, -c]
    command:
      - |
        import os, secrets
        from pathlib import Path
        for root in ("/cli-tools", "/cli-control"):
            os.chown(root, 10000, 10000)
        key = Path("/cli-control/token")
        if not key.exists():
            fd = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o400)
            with os.fdopen(fd, "w") as stream:
                stream.write(secrets.token_urlsafe(48))
            os.chown(key, 10000, 10000)
  cli-maintenance:
    build:
      context: .
      dockerfile: runtime/Dockerfile
      target: cli-maintenance
    depends_on:
      prepare-cli-storage: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    environment:
      HOME: /tmp
      CLI_MAINTENANCE_TOKEN_FILE: /cli-control/token
    volumes: [cli-tools:/cli-tools, cli-maintenance-control:/cli-control:ro]
    networks: [cli-control, cli-maintenance-egress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; from pathlib import Path; urllib.request.urlopen(urllib.request.Request("http://localhost:8092/health",headers={"Authorization":"Bearer "+Path("/cli-control/token").read_text().strip()}),timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"]
    networks: [app, web-ingress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
      - /app/.next/cache:rw,nosuid,nodev,size=32m,uid=1000,gid=1000
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
networks:
  cli-control: {internal: true}
  cli-maintenance-egress: {}
  web-ingress: {}
  app: {internal: true}
  runtime-control: {internal: true}
  backend-egress: {}
  agent-egress: {}
volumes:
  cli-tools: {}
  cli-maintenance-control: {}
  runtime-control-secrets: {}
  database-data: {}
  app-data: {}
  git-cache: {}
  environment-workspaces: {}
  analysis-workspaces: {}
  analysis-context: {}
  uploads: {}
  ai-credentials: {}
  ai-sessions: {}
