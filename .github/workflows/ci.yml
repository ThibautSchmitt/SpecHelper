name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spechelper
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: spechelper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      SPECHELPER_TEST_POSTGRES_DSN: host=127.0.0.1 dbname=postgres user=postgres password=ci-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.4
      - run: uv sync --project backend --frozen
      - run: uv run ruff check --config pyproject.toml . ../runtime
        working-directory: backend
      - run: uv run python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - name: Install browser for security regressions
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify access, library and model regressions in desktop and mobile browsers
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start > "$RUNNER_TEMP/spechelper-frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:3000", timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Security-test frontend did not start")
          PY
          npx playwright test tests/v19-security.spec.ts tests/v20-library.spec.ts tests/v20-models.spec.ts tests/v21-assistant.spec.ts tests/v22-clarification.spec.ts
