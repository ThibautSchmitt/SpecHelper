[project]
name = "spechelper"
version = "0.1.0"
description = "Self-hosted business requests analyzed against real project sources"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "gunicorn>=23,<24",
  "pglast>=7,<8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pyyaml>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.10", "ruff>=0.11"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", ".."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["core", "config", "runtime"]
